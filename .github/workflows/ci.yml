name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies (CPU-only torch)
        run: |
          python -m pip install --upgrade pip
          pip install "torch==2.14.1+cpu" --extra-index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install pytest ruff

      - name: Lint
        run: ruff check . --select E9,F63,F7,F82

      - name: Run tests
        env:
          # Dummy values so settings load; tests must not call real services.
          GROQ_API_KEY: dummy
          TAVILY_API_KEY: dummy
          PINECONE_API_KEY: dummy
          PINECONE_INDEX_NAME: test-index
          PINECONE_NAMESPACE: test-ns
          ADMIN_API_KEY: test
          APP_ENV: test
        run: pytest -q

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t it-support-rag .